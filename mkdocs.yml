site_name: datafog-mcp
site_url: https://github.com/DataFog/datafog-mcp
repo_url: https://github.com/DataFog/datafog-mcp
repo_name: DataFog/datafog-mcp
copyright: 2026 DataFog
nav:
  - Home: index.md
  - Development: development.md
  - Roadmap: roadmap.md
  - CLI: cli.md

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DataFog/datafog-mcp
