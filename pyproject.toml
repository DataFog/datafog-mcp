[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "datafog-mcp"
version = "0.1.0"
description = "MCP server for PII detection and redaction — the privacy layer for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sid Mohan", email = "hi@datafog.ai" }]
keywords = ["mcp", "pii", "privacy", "ai", "agents", "redaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=3,<4",
    "datafog-core>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.11.0",
    "pyright>=1.1.398",
    "pre-commit>=3.8.0",
    "coverage>=7.6.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.11.0",
    "pyright>=1.1.398",
    "pre-commit>=3.8.0",
    "coverage>=7.6.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
ci = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.11.0",
    "pyright>=1.1.398",
    "coverage>=7.6.0",
]

[project.urls]
Homepage = "https://datafog.ai"
Repository = "https://github.com/DataFog/datafog-mcp"
Documentation = "https://docs.datafog.ai/mcp"

[project.scripts]
datafog-mcp = "datafog_mcp.__main__:main"


[tool.hatch.build.targets.wheel]
packages = ["src/datafog_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]
ignore = []
fixable = ["ALL"]
unfixable = []
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
disallow_incomplete_defs = true
disallow_any_unimported = false
ignore_missing_imports = true
exclude = ["tests", "build", "dist", ".venv", ".pytest_cache"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", ".ruff_cache", ".mypy_cache", "build", "dist", "coverage", "**/node_modules", "**/__pycache__", "**/.*" ]
typeCheckingMode = "standard"
reportMissingTypeStubs = true

[tool.pytest.ini_options]
addopts = [
  "-q",
  "--strict-markers",
  "--disable-warnings",
  "--cov=src/datafog_mcp",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/datafog_mcp"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.uv]
index-url = "https://pypi.org/simple"
